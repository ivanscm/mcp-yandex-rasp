[project]
name = "mcp-yandex-rasp"
version = "0.2.0"
description = "MCP server for Yandex Rasp API — search routes, schedules, stations for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "certifi>=2024",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
mcp-yandex-rasp = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
